spring.application.name=netpulse-backend
server.port=8080

# Oracle configuration
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${ORACLE_USERNAME:netpulse}
spring.datasource.password=${ORACLE_PASSWORD:change-me}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JDBC behavior
spring.jdbc.template.query-timeout=10

# Disable automatic JPA assumptions because NetPulse uses JDBC directly.
spring.jpa.open-in-view=false

# Basic request logging for development.
logging.level.com.netpulse=INFO
